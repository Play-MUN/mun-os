# mun-launchd: the content mount point of mount-access games, and its name
# from before the MUN naming (docs/game-cards.md). Games built for linux-arm64-gl-v0
# may have their data location compiled in; engines on existing Game Cards
# may have /run/neptune/card/content. The link points at the directory
# each game unit mounts its card on, so both names reach the same card
# inside the game's own mount namespace. Nothing else lives under
# /run/neptune.
d /run/mun/card 0755 root root -
d /run/neptune 0755 root root -
L /run/neptune/card - - - - /run/mun/card
