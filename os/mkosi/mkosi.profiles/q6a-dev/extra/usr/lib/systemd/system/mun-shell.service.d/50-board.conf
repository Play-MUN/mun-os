# Development image for a board (profile q6a-dev): under Automatic the shell
# starts in 1920x1080 at 60 Hz, or the closest mode within it, whatever the
# display prefers (services/mun-shell/README.md, Resolution). The board's
# DP-to-HDMI bridge (RA620) washes out 10-bit input, so the shell caps the
# link at 8 bits per channel (README, Display path).
[Service]
Environment=MUN_DISPLAY_MAX=1920x1080@60
Environment=MUN_DISPLAY_MAX_BPC=8
