# q6a-dev: the Dragon Q6A's microSD slot is this laboratory console's card
# reader. The card service admits only a whole card in it, named by the card's
# CID (services/mun-cardd/README.md, MUN_CARDD_SLOTS); its controller is the
# device tree's sdhc at 8804000 (the eMMC, the system disk, is at 7c4000).
# The device policy opens MMC block devices to the service, the eMMC's among
# them; the service never admits those as a card.
[Service]
Environment=MUN_CARDD_SLOTS=/devices/platform/soc@0/8804000.mmc
DeviceAllow=block-mmc rw
