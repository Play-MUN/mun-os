# qemu-dev: the MUN OS development image for the QEMU lab (vm/mundev.py).
# QEMU is a development environment, not a MUN hardware target: this profile
# says so in the image identity (environment = "qemu-arm64", release = false)
# and adds the one development access path, qemu-ga (QEMU's guest-side
# control daemon), which runs commands as root for whoever holds the
# host-side socket. A release
# composition does not include this profile.
[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=yes
Hostname=mun-qemu
# The display shows firmware, then the shell: kernel and systemd messages go
# to the serial port (the guest's console log); quiet, loglevel=3 and no
# console cursor keep the framebuffer blank until the splash.
# systemd.firstboot=off: first boot never waits for an answer on a console.
KernelCommandLine=
        console=ttyAMA0
        rw
        quiet
        loglevel=3
        vt.global_cursor_default=0
        systemd.firstboot=off
Packages=
        # Debian's arm64 kernel carries the virtio drivers QEMU's virt machine needs
        linux-image-arm64
        # systemd-boot and the UKI stub, installed from the image into the ESP
        systemd-boot-efi
        qemu-guest-agent
        # tools the host runs through qemu-ga for evidence
        procps
        iproute2
# The laboratory's time zone from the host (extra/usr/lib/mun/lab-timezone).
ExtraTrees=extra

[Build]
# Read by mkosi.postinst.chroot, which writes them into /usr/lib/mun/release,
# and by the builder for the artifact name and BUILD-INFO.
Environment=
        MUN_ENVIRONMENT=qemu-arm64
        MUN_RELEASE=false
