# Development image for a board (profile q6a-dev): the board's sound reaches
# HDMI through mun-board-audio.service some seconds after the shell has
# started (the audio DSP, and the sound card after it, come up late). The
# shell does not wait for it: it loads meanwhile, and its start-up waits for
# the sound device, up to MUN_SHELL_SOUND_WAIT seconds from the shell's
# start, until it has played for a moment (services/mun-shell/README.md,
# Motion). 30 s covers a DSP whose link has to be reset (board-audio-route).
# The card appears a moment before its route to HDMI is set, and a device
# opened in between plays to nothing and fails: within that wait the shell
# opens the device only once the file board-audio-route writes when the
# route is set exists (MUN_SHELL_SOUND_READY). After the wait it opens the
# device whatever the file, so a route that is never set costs no more than
# a card that never comes.
[Unit]
Wants=mun-board-audio.service

[Service]
Environment=MUN_SHELL_SOUND_WAIT=30
Environment=MUN_SHELL_SOUND_READY=/run/mun-board-audio/route-set
