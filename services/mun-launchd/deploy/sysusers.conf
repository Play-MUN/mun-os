# mun-launchd: the unprivileged user every game session runs as, and the
# shell's group, which owns the launcher socket. The game user is a member of
# no device group: systemd gives a unit every group its user belongs to, so a
# membership here would reach every game whatever its runtime profile. Each
# profile names the groups of its devices itself (SupplementaryGroups=, set in
# launchd.py; docs/runtime.md), and the unit's DevicePolicy narrows access
# further. The groups only have to exist: the lines below create one that the
# base system did not.
g mun-shell -
u mun-game - "MUN game sessions" /nonexistent /usr/sbin/nologin
g video -
g input -
g render -
g audio -
