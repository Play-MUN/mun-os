# Development image for a board (profile q6a-dev): the display link's cap of
# 8 bits per channel (mun-shell.service.d/50-board.conf) is set before the
# standby picture is shown. Left to the shell's start, the change
# reconfigured the link with the picture on screen, and a display went dark
# for a moment between the picture and the shell.
[Service]
Environment=MUN_DISPLAY_MAX_BPC=8
