# Boots a downloaded MUN OS development image on each kind of computer the
# laboratory runs on and plays its MUN Collect card (`./mun dev smoke`):
# start, card, game, exit, clean power-off. Manual, because it needs a bundle
# (`./mun dev bundle`): a release of this repository holding one, or the
# address of one elsewhere. Hosted runners are virtual machines without
# nested virtualization, so every guest here is emulated (TCG) and slow; a
# pass says the tools work on that system, not how fast the console is.
name: Hosts

on:
  workflow_dispatch:
    inputs:
      release:
        description: Tag of a release of this repository whose assets are a bundle
        required: false
      bundle:
        description: Or the address of a bundle (https)
        required: false

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x86_64, runner: ubuntu-24.04 }
          - { name: Linux ARM64, runner: ubuntu-24.04-arm }
          - { name: Windows x86_64, runner: windows-2025 }
          - { name: Windows ARM64, runner: windows-11-arm }
          - { name: macOS ARM64 (virtual machine), runner: macos-15 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: QEMU (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-arm qemu-utils qemu-efi-aarch64
      - name: QEMU (Windows)
        if: runner.os == 'Windows'
        run: choco install qemu -y --no-progress
      - name: QEMU (macOS)
        if: runner.os == 'macOS'
        run: brew install qemu
      - name: Host checks
        run: python mun dev list && python -m unittest discover -s tests -p 'test_host.py' -v
      - name: Bundle from a release
        if: inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.release }}" --dir bundle
      - name: Smoke check
        run: python mun dev smoke --bundle "${{ inputs.release != '' && 'bundle' || inputs.bundle }}"
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: smoke-${{ matrix.runner }}
          path: |
            .local/mun/guests/smoke/smoke.json
            .local/mun/guests/smoke/screens/
            .local/mun/guests/smoke/console.log
            .local/mun/guests/smoke/qemu.log
          if-no-files-found: warn
