# Development image for a board (profile q6a-dev): the boot partition stays
# mounted once used. Unmounted when idle (after systemd's 2 min), it took
# mun-board-diag.service, which requires it, down with it: the shutdown dump
# ran then, hung on the partition going away under it, and was lost at the
# real shutdown, the unit failed on every boot.
[Automount]
TimeoutIdleSec=0
