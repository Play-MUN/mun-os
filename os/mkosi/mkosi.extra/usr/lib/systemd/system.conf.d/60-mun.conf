# A console has no use for the PC's restart chord. Left on, anything that can
# produce key events (a keyboard, or a process that can write to an input
# device) restarts the machine at once, in the middle of a game or a save.
# The target the single chord starts is masked beside this
# (etc/systemd/system/ctrl-alt-del.target).
[Manager]
CtrlAltDelBurstAction=none
