# q6a-dev: a MUN OS development image for the Radxa Dragon Q6A (QCS6490), a
# laboratory board, written to a microSD card. Not a hardware target of MUN:
# the image says so (environment radxa-dragon-q6a, release = false).
#
# What differs from qemu-dev, and why:
# - The kernel is Radxa's (pinned-packages.json): Debian's has no device tree
#   for this board with its display, and its HDMI path (DisplayPort through a
#   RA620 bridge) works with Radxa's kernel and device tree.
# - Type 1 boot entries, not a unified kernel image: the board's firmware
#   6.0.260120 reboots silently on systemd-stub images. The entry names the
#   device tree of the kernel package (Devicetree=), and the kernel is stored
#   uncompressed (mkosi.postinst.chroot), since Radxa ships it gzip-wrapped and
#   the firmware starts only an EFI executable.
# - The display must be card0, the one device Qt's framebuffer platform opens
#   (services/mun-shell/src/displaydevice.h). The kernel builds simpledrm in,
#   which takes card0 for the firmware's framebuffer, so the default entry
#   does not start simpledrm (initcall_blacklist=simpledrm_platform_driver_init)
#   and msm becomes card0. On the board (2026-10-27) that entry gave 1080p;
#   the earlier default, which keeps the firmware framebuffer from being
#   registered at all (sysfb_init), once found HDMI disconnected.
#   mkosi.postoutput adds entries for that candidate, for the firmware
#   framebuffer kept (display on card1) and for diagnosis.
# - The boot is quiet and goes straight to the shell: the menu is hidden (a
#   key held at power-on shows it), the kernel and systemd print nothing on
#   HDMI, and the debug UART keeps the console. The other entries print
#   everything on HDMI (tty1). A diagnostic dump is written to the boot
#   partition on every boot (/usr/lib/mun/board-diag).
# - Laboratory access: wired network by DHCP (systemd-networkd) and SSH by key
#   only. The image carries no key; the lab's key is added to the installed
#   system's /root/.ssh/authorized_keys when it is written to the board.
# - Game Cards in the microSD slot: a card image written whole to a microSD
#   card is a Game Card there (mun-cardd.service.d/50-board-reader.conf). With
#   the eMMC first in the firmware's boot order, as the laboratory board has
#   it, a card in the slot is never booted. The wired network's PCIe link
#   keeps L1 but not its substates (udev/rules.d/70-mun-board-ethernet.rules):
#   with them, pulling a card out of the slot left the network down until the
#   next boot.
# - The board's firmware for the GPU and the audio DSP, the audio topology and
#   ALSA's use-case profiles (pinned-packages.json), and alsa-utils.
# - The shell starts in 1920x1080 at 60 Hz under Automatic
#   (mun-shell.service.d/50-board.conf), and draws through the GPU: Qt's
#   eglfs on KMS, Mesa's freedreno (mun-shell.service.d/60-board-gpu.conf).
# - Sound on HDMI: the DSPs' driver is kept out of the initrd, which does not
#   carry their firmware, so they start once the root file system, which
#   does, is mounted (see KernelModulesInitrdExclude= below); the card's
#   mixer is routed to HDMI (mun-board-audio.service), ALSA's default device
#   is that output (/etc/asound.conf), and the shell starts after it, so its
#   start-up sound has a device (mun-shell.service.d/70-board-audio.conf).
# - The CPUs scale with the scheduler's load under schedutil (the kernel's
#   default here is ondemand); the blue status LED, which the device tree
#   makes beat, is off (tmpfiles.d/mun-board-led.conf).
[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=no
Devicetree=qcom/qcs6490-radxa-dragon-q6a.dtb
Hostname=mun-q6a
# clk_ignore_unused, as Radxa's images boot: clocks no driver has claimed yet
# stay on, those of msm (a module) among them.
# systemd.firstboot=off: first boot never waits for an answer on a console.
# The default entry is quiet on HDMI; mkosi.postoutput takes the quiet
# arguments out, and adds console=tty1, for the other entries.
# video=: the kernel's console takes the mode the shell sets
# (mun-shell.service.d/50-board.conf), 1920x1080 at 60 Hz, instead of the
# display's preferred one: with a 3440x1440 monitor the screen changed mode,
# and went dark while the monitor followed, at every hand-over between the
# console and the shell (at start, and around every game).
KernelCommandLine=
        rw
        video=HDMI-A-1:1920x1080@60
        clk_ignore_unused
        console=ttyMSM0,115200n8
        systemd.firstboot=off
        initcall_blacklist=simpledrm_platform_driver_init
        cpufreq.default_governor=schedutil
        quiet
        loglevel=3
        systemd.show_status=false
        rd.systemd.show_status=false
        rd.udev.log_level=3
        vt.global_cursor_default=0
# The initrd carries only mkosi-initrd's default modules and msm, with what
# they depend on: the board's storage, from the controller to ext4, is built
# into Radxa's kernel. msm in the initrd: the display comes up, and takes
# card0, before the root file system is mounted, so the boot's own messages
# reach HDMI. mkosi puts every module in unless excluded (the includes only
# take priority over the exclusion): without it the initrd carried all
# 4399 (63 MB), qcom_q6v5_pas among them, which then started the DSPs
# without their firmware and left them offline. mkosi matches the patterns
# against paths that begin at the subsystem (drivers/..., no leading slash).
KernelModulesInitrdInclude=
        default
        drivers/gpu/drm/msm/
KernelModulesInitrdExclude=
        .*
Packages=
        linux-image-7.0.11-7-qcom
        systemd-boot-efi
        procps
        iproute2
        radxa-firmware-qcs6490
        firmware-qcom-audioreach
        firmware-qcom-soc
        alsa-ucm-conf
        alsa-utils
        openssh-server
ExtraTrees=extra
# mkosi.postinst.chroot and mkosi.postoutput beside this file are mkosi's own
# script names: it runs them for this profile without being told.

[Build]
Environment=
        MUN_ENVIRONMENT=radxa-dragon-q6a
        MUN_RELEASE=false
        MUN_IMAGE_FORMAT=raw
