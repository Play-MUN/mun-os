# MUN OS: the composition every MUN OS image shares. Boot, kernel and
# development access belong to a profile (mkosi.profiles/); qemu-dev is the
# only one until an official hardware configuration is selected. Built by
# os/builder/build.sh inside a disposable builder, which also generates the
# APT sources for the pinned Debian snapshot (os/inputs.json) into
# mkosi.sandbox/ before it runs mkosi: packages are only ever resolved there.
[Config]
MinimumVersion=25.3
# mkosi.images/initrd, built first; the bootable profile boots with it.
Dependencies=initrd

[Distribution]
Distribution=debian
Release=trixie
Architecture=arm64

[Output]
Format=disk
ImageId=mun-os
Output=mun-os
ManifestFormat=json
CompressOutput=no
SplitArtifacts=

[Build]
# Build scripts never reach the network: external sources are fetched and
# verified before mkosi runs and arrive as build sources.
WithNetwork=no

[Content]
Initrds=%O/initrd
WithDocs=no
Locale=C.UTF-8
Timezone=UTC
CleanPackageMetadata=no
# The console's system: init, device manager, and what the card service,
# the launcher and the shell need at run time. Each service lists its own
# packages in services/*/deploy/packages*; tests/test_os.py checks that
# every one of them is here, so the image and a lab deployment agree.
Packages=
        systemd
        systemd-sysv
        udev
        dbus
        kmod
        sudo
        # card service
        python3
        python3-pyudev
        util-linux
        # launcher and the provisional linux-arm64-gl-v0 game profile (docs/runtime.md)
        libsdl2-2.0-0
        libopenal1
        libtinyxml2-11
        libgl1
        libegl1
        libgbm1
        libgl1-mesa-dri
        libasound2t64
        libstdc++6
        # shell (Qt 6 Quick on linuxfb)
        libqt6core6t64
        libqt6gui6
        libqt6network6
        libqt6qml6
        libqt6quick6
        qt6-qpa-plugins
        qml6-module-qtquick
        qml6-module-qtquick-window
        qml6-module-qtquick-templates
        qml6-module-qtqml-workerscript
        fonts-inter
# Compilers and headers for the components and the example games; present
# only in the build overlay, never in the image.
BuildPackages=
        gcc
        g++
        make
        libc6-dev
        cmake
        ninja-build
        pkgconf
        qt6-base-dev
        qt6-declarative-dev
        libasound2-dev
        libsdl2-dev
        libopenal-dev
        libgl-dev
        libglu1-mesa-dev
