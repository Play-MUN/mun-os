# MUN OS: the system journal stays on the console's own storage, bounded.
# A boot writes well under 1 MiB (the services' lines, a game's session);
# 32 MiB keeps dozens of boots for diagnosis. Without a bound of its own,
# journald would take up to a tenth of the root file system (about 600 MB
# of the 6 GiB root).
[Journal]
SystemMaxUse=32M
