# mun-launchd: the unprivileged user every game session runs as, and the
# shell's group, which owns the launcher socket. Groups give device *node*
# access; the unit's DevicePolicy narrows it further. render and audio serve
# the provisional linux-arm64-gl-v0 profile (docs/runtime.md).
g mun-shell -
u mun-game - "MUN game sessions" /nonexistent /usr/sbin/nologin
m mun-game video
m mun-game input
m mun-game render
m mun-game audio
