# Development image for a board (profile q6a-dev): the shell draws through
# the board's GPU (Qt's eglfs on KMS and GBM, Mesa's freedreno, OpenGL ES)
# instead of linuxfb and Qt Quick's software renderer. The shell finds out
# at run time and draws accordingly; its journal says which renderer it
# took ("mun-shell: renderer: ...").
[Service]
Environment=QT_QPA_PLATFORM=eglfs
Environment=QT_QPA_EGLFS_INTEGRATION=eglfs_kms
UnsetEnvironment=QT_QUICK_BACKEND QT_QPA_FB_DRM
