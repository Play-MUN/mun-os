# Development image for a board (profile q6a-dev): ALSA's default device,
# which the shell and the games play to, is the board's HDMI output (PCM 1
# of its card, routed by mun-board-audio.service).
pcm.!default {
    type plug
    slave.pcm "hw:QCS6490RadxaDra,1"
}
ctl.!default {
    type hw
    card QCS6490RadxaDra
}
